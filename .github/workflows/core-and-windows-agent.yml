name: Core and Windows Agent Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/broker-resolver-poc
    paths:
      - worker/**
      - windows_agent/**
      - mt5/**
      - scripts/windows/**
      - tests/**
      - contracts/**
      - requirements*.txt
      - pyproject.toml
      - .github/workflows/core-and-windows-agent.yml
  pull_request:
    paths:
      - worker/**
      - windows_agent/**
      - mt5/**
      - scripts/windows/**
      - tests/**
      - contracts/**
      - requirements*.txt
      - pyproject.toml
      - .github/workflows/core-and-windows-agent.yml

permissions:
  contents: read

concurrency:
  group: core-windows-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install core dependencies
        run: python -m pip install -r requirements.txt

      - name: Run cross-platform core tests
        run: python -m pytest tests --ignore=tests/windows -q

      - name: Verify pinned control-plane contract
        run: python scripts/verify_contract_sync.py

      - name: Compile Python sources
        run: python -m compileall -q worker windows_agent

  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows dependencies
        run: python -m pip install -r requirements-windows.txt

      - name: Verify no MT5 family process is running
        run: |
          $forbidden = @(
            'terminal', 'terminal64',
            'metaeditor', 'metaeditor64',
            'metatester', 'metatester64'
          )
          $found = @($forbidden | ForEach-Object {
            Get-Process -Name $_ -ErrorAction SilentlyContinue
          })
          if ($found.Count -gt 0) {
            throw "Forbidden MT5 family process present before tests."
          }

      - name: Run Windows Agent tests
        run: python -m pytest tests/windows -q

      - name: Compile Windows Agent
        run: python -m compileall -q windows_agent

      - name: Verify no MT5 family process remains
        if: always()
        run: |
          $forbidden = @(
            'terminal', 'terminal64',
            'metaeditor', 'metaeditor64',
            'metatester', 'metatester64'
          )
          $found = @($forbidden | ForEach-Object {
            Get-Process -Name $_ -ErrorAction SilentlyContinue
          })
          if ($found.Count -gt 0) {
            throw "Forbidden MT5 family process present after tests."
          }
