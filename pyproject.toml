[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
  "tests",
  "lab/mt5_direct_endpoint/tests",
  "lab/mt5_direct_endpoint/mql5/tests",
  "lab/mt5_direct_endpoint/windows/tests",
]
addopts = "-ra --strict-markers"
markers = [
  "windows: requires a Windows host and Windows-only dependencies",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
